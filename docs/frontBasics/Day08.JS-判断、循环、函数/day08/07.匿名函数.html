<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 匿名函数: 把名字隐藏的函数
        // 给匿名函数起一个临时名称
        // 把函数赋值给一个变量,变量名就是函数的临时名称
        // 函数名可以随时随地改
        let funName = function (){
            console.log("小明222");
        }
        funName()
    </script>
</head>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 循环控制 break
        // break : 当代码执行到break时,直接终止循环代码
        while(true){
            console.log("hello");
            break;      // 终止循环(杀死循环)
            console.log('hello22');
        }


        // continue 关键字
        // continue : 当程序执行到 continue 时,
        // 会跳过循环剩下的代码,进入下一次的循环
        for(let i = 1; i <= 5; i++){
            console.log("i 的值为:",i);
            if(i == 2){
                continue;
            }
            console.log("计数器之后:" , i);
        }

    </script>
</head>
<body>
    
</body>
</html>

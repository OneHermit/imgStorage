<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="btn">发送验证码</button>
    <script>
        // 1 间歇定时器: 每隔一个时间段来执行一个操作
        // 参数1: 定时执行的代码函数
        // 参数2: 定时执行的周期(毫秒)
        // let time = 0;
        // let a = setInterval(function(){
        //     time = time + 1;
        //     console.log("hello world",time);
        //     if(time == 3){
        //         clearInterval(a)
        //     }
        // } , 1000)

        // 清除定时器
        // clearInterval(a)
        // console.log("hello");
        // console.log("hello");
        // console.log("hello");
        // console.log("hello");
        // 结论:定时器和其他代码是异步执行的,就是浏览器从上往下执行代码
        // 定时器启动完就任由定时器自己发展(创建之后就放手了)

        // 延时定时器
        // let b = setTimeout(function(){
        //     console.log('爆炸💥');
        // },3000)

        // 清除延时定时器
        // clearTimeout(b)

        // 案例
        let btn = document.querySelector('.btn')
        btn.addEventListener('click',function(){
            // 禁用按钮点击
            btn.disabled = true;
            // 定时器来做秒数倒数
            let i = 3;
            let a = setInterval(function(){
                btn.innerHTML = `发送验证码(${i}s)`
                if(i == 0){
                    // 接触按钮的禁用以及去除秒数
                    btn.disabled = false;
                    btn.innerHTML = "发送验证码"
                    clearInterval(a)
                }
                i = i - 1;
            },1000)
        })
    </script>
</body>
</html>

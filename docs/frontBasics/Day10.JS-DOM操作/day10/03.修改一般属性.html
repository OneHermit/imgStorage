<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="" alt="">
    <input type="button">
    <script>
        // 一般属性,指就是可以用过点 给点出来的属性
        let img = document.querySelector('img')
        img.src = './image/tiger.jpeg'
        img.width = 200;
        img.height = 200;

        let input = document.querySelector('input')
        input.value = "按钮"
    </script>
</body>
</html>

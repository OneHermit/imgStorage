<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 
        通配符的作用：一般用于去除所有标签原有的样式，如标题，段落标签的间距
      */
      * {
        color: red;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <a href="#">hello</a>
    <a href="#" id="abc">hello</a>
    <a href="#">hello</a>
    <h1>
      这是一个标题
      <a href="#">hello</a>
    </h1>
    <h1>hello</h1>
    <p>段落</p>
    <h2>标题2</h2>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello</title>
    <style>
      /* CSS 注释 
       选择器的作用：告诉浏览器要选中哪个标签
      */
      p {
        /* 设置字体颜色 */
        color: red;
        /* 设置字体大小 */
        font-size: 50px;
        /* 设置背景颜色 */
        background-color: pink;
        /* 宽高设置 */
        width: 400px;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <h1>helo</h1>
    <p>hello world 您好 师姐</p>
  </body>
</html>

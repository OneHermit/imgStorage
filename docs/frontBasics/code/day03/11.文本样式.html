<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        /* 文本大小 */
        font-size: 30px;
        /* 文本粗细 */
        font-weight: 900;
        /* 文本缩进 */
        text-indent: 2em;
      }

      h1 {
        text-align: center;
      }

      span {
        text-decoration: underline;
      }

      /* a 标签处理 */
      a {
        text-decoration: none;
        color: black;
      }
      a:hover {
        color: blue;
        text-decoration: underline;
      }
    </style>
  </head>

</html>

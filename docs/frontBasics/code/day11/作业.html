<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .windows {
            width: 400px;
            height: 600px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px #ccc;
        }

        /* 标题处理 */
        .title {
            background-color: #3d68b4;
            height: 50px;
            text-align: center;
            color: white;
            font-weight: 600;
            line-height: 50px;
        }

        /* 中间内容处理 */
        .content {
            height: 500px;
            width: 100%;
            overflow: auto;
        }

        .rightMsg {
            display: flex;
            justify-content: right;
        }

        .right {
            background-color: #3d68b4;
            color: white;
            padding: 1px 6px;
            margin: 2px 0px;
            border-radius: 5px;
            border-bottom-right-radius: 0;
        }

        .leftMsg {
            display: flex;
            justify-content: left;
        }

        .left {
            background-color: #f40584;
            color: white;
            padding: 1px 6px;
            margin: 2px 0px;
            border-radius: 5px;
            border-bottom-left-radius: 0;
        }


        /* 脚部处理 */
        .footer {
            border-top: 1px solid #ccc;
            padding: 5px;
        }

        .footer input {
            border-radius: 20px;
            height: 35px;
            width: 86%;
            padding-left: 15px;
        }

        .footer button {
            background-color: #3d68b4;
            color: white;
            border-radius: 18px;
            width: 13%;
            height: 35px;
        }
    </style>
</head>

<body>
    <div class="windows">
        <div class="title">级简聊天窗口</div>
        <div class="content">
            <!-- <div class="leftMsg">
                <div class="left">快回复消息...</div>
            </div> -->
            <!-- <div class="rightMsg">
                <div class="right">123</div>
            </div> -->
        </div>
        <div class="footer">
            <input class="input" type="text" placeholder="输入消息...">
            <button class="send">发送</button>
        </div>
    </div>

    <script>
        // 获取标签对象
        let send = document.querySelector('.send')
        let input = document.querySelector('.input')
        let content = document.querySelector('.content')

        send.addEventListener('click', function () {
            // 回复消息
            if (input.value != '') {
                reply()
            }
            // 模拟有消息
            message('嘻嘻哈哈')
        })

        input.addEventListener('keydown', function (e) {
            // 回复消息
            if (e.key == 'Enter') {
                reply()
            }
        })

        // 抽签回复消息的代码
        function reply() {
            // 创建会话标签
            let rightMsg = document.createElement('div')
            rightMsg.className = "rightMsg";
            // 给session回复的消息以及新的对话
            rightMsg.innerHTML = `<div class="right">${input.value}</div>`;
            content.appendChild(rightMsg);
            input.value = '';
        }


        // 模拟用户来消息
        function message(msg) {
            // 创建会话标签
            let leftMsg = document.createElement('div')
            leftMsg.className = "leftMsg"
            // 给session回复的消息以及新的对话
            leftMsg.innerHTML = `<div class="left">${msg}</div>`;
            content.appendChild(leftMsg);
        }
    </script>
</body>

</html>

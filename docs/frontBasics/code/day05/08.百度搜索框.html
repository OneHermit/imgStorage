<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .father{
            text-align: center;
            margin-top: 60px;
        }
        .father .baidu{
            display: inline-block;
            width: 800px;
            height: 100px;
            border: 1px solid blue;
            border-radius: 15px;
        }
        .baidu div{
            display: inline-block;
        }
        .left{
            width: 85%;
            line-height: 100px;
        }
        .right{
            width: 116px;
            line-height: 100px;
            background-color: blue;
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .left input{
            width: 650px;
            height: 80px;
            border: none;
            font-size: 25px;    /*加大字体*/
        }
        .left input:focus{
            outline: none;   /*去除边框*/
        }

        .right button{
            height: 90px;
            width: 110px;
            border: none;
            font-size: large;
            background-color: blue;
            color: aliceblue;

            cursor: pointer;
        }
    
    </style>
</head>
<body>
    <div class="father">
        <div class="baidu">
            <div class="left">
                <input type="text" name="shousuo">
            </div>
            <div class="right">
                <button>百度一下</button>
            </div>
        </div>
    </div>
</body>
</html>

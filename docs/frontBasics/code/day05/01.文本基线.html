<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: pink;
            /* 设置行高无法垂直居中 */
            height: 40px;
            line-height: 40px;
        }
        /* 设置中线对齐则上下对齐 */
        img{
            vertical-align: middle;
        }
        span{
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div>
        <img src="./image/大白菜.png" alt="">
        <span>您好，hello</span>
    </div>
</body>
</html>

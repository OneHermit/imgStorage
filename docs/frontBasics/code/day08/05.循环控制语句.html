        // 循环控制 break 关键字
        // break : 但代码执行到 break 时 直接终止循环代码的执行（杀死循环）
        while (true) {
            console.log('hello');
            break;
            console.log('hello22');   // 无法执行，因为到了break 已经终止了。
        }

        // 循环控制 continue 关键字
        // continue ： 当程序执行到 continue 时会跳过本次循环剩下的代码，进入下一次循环


        // 计算 1-100 间的偶数
    </script>
</head>

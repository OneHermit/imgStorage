<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 300px;
            border: 2px solid red;
            margin: 20px;
            /* 不溢出:调试标题时需要注释 */
            overflow: hidden;
            /* 标题显示 */
            position: relative;
        }

        .box:hover img {
            /* 放大倍数 */
            transform: scale(1.2);
        }

        .box img {
            /* 增加过渡动画 */
            transition: all 1s ease;
        }

        /* 处理标题 */
        .box .title {
            /* background-color: pink; */
            /* 设置黑色背景透明0.5 */
            background-color: rgba(0, 0, 0, 0.5);
            position: absolute;
            width: 100%;
            height: 100px;
            bottom: -100px;

            /* 文字处理 */
            text-align: center;
            color: white;
        }

        /* 鼠标悬浮向上移动100px ,打开父溢出*/
        .box:hover .title {
            /* 放大倍数 */
            transform: translateY(-100px);
        }

        .box .title {
            /* 增加过渡动画 */
            transition: all 1s ease;
        }
    </style>
</head>

<body>
    <div class="box">
        <img src="./image/篮球.png" alt="" width="100%" height="100%">
        <!-- 标题盒子 -->
        <div class="title">
            <h3>篮球</h3>
            <p>正在投篮</p>
        </div>
    </div>
</body>

</html>

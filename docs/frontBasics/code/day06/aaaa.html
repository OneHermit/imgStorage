<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./font_bv7nueglp6d/iconfont.css">
    <style>
        .head1 {
            width: 350px;
            border: 1px solid #ccc;
            border-radius: 15px;
            overflow: hidden;
        }

        .first {
            background-color: blue;
            padding: 15px;
        }

        .icon-yonghu {
            font-size: 50px;
            color: white;
        }

        .right {
            text-align: left;
            display: inline-block;
        }

        .one {
            color: white;
        }

        .two {
            color: white;
            font-size: 12px;
        }

        .second {
            height: 200px;
            overflow: scroll;
        }

        .footer {
            padding: 20px;
            background-color: rgb(223, 228, 232);
            position: relative;
        }

        .footer div {
            display: inline-block;
        }

        .footer .left {
            color: orange;
        }

        .footer .right {
            color: #595555;
            position: absolute;
            right: 10px;
        }
    </style>
</head>

<body>
    <div class="head1">
        <div class="first">
            <span class="iconfont icon-yonghu"></span>
            <div class="right">
                <div class="one">张三</div>
                <div class="two">高级UI设计师</div>
            </div>
        </div>
        <div class="second">这个产品设计得非常出色！用户界面简洁直观，交互体验流畅。
            特别是色彩搭配和图标设计，既现代又不失专业性。我特别喜欢
            它的响应式设计，在不同设备上都能完美展示。动画效果恰到好
            处，不会过于花哨但又能提供良好的视觉反馈。唯一的建议是希
            望增加更多的自定义选项，让用户可以根据自己的喜好调整界面
            风格。
        </div>
        <div class="footer">
            <div class="left">
                <span class="iconfont icon-shoucang"></span>
                <span class="iconfont icon-shoucang"></span>
                <span class="iconfont icon-shoucang"></span>
                <span class="iconfont icon-shoucang"></span>
                <span class="iconfont icon-shoucang"></span>
            </div>
            <div class="right">2005年10月1日</div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 图片标签 -->
     <!-- 路劲：
        相对路径： 就是你所在的位置相对于目标文件位置的路径
            ./   表示从当前所在的文件夹中寻找 （可以省略）
            ../  表示从上一层文件夹中寻找
        绝对路径： 就是从磁盘开始一层一层到具体的详细位置(不使用)
     
     -->
    <img src="./image/logo.png" alt="">
    
    <!-- 视频标签 -->
    <video src="./image/video.mp4" controls width="400px"></video>
    <video src="./iamge/video.mp4" controls width="400px" loop></video>
    <video src="./image/video.mp4" controls width="400px" muted></video>
    <video src="./image/video.mp4" controls width="400px" muted autoplay></video>

    <br><hr>
    <!-- 音频标签 -->
    <audio src="./image/郭顶-凄美地.mp3" controls loop></audio>
    <audio src="./image/郭顶-凄美地.mp3" controls muted autoplay></audio>
</body>
</html>

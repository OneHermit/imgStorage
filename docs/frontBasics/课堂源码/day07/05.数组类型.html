<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 数组类型声明
        let arr = ['张三','李四','王五']
        // 取数据
        console.log(arr[0] , arr[1] , arr[2]);
        // 修改数据
        // arr[2] = '张小三'
        console.log(arr);
        // 获取数组的长度
        console.log(arr.length);
        // 数组的尾部添加元素
        arr.push(4)
        console.log(arr);

        // 添加指定位置的数据
        arr.splice(1,0,'嘻嘻哈哈')
        console.log(arr);
        // 指定位置删除数据
        arr.splice(1, 2)
        console.log(arr);
    </script>
</head>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 变量: 可以理解为就是一个容器(杯子,桶,箱子),可以装数据,数据是可变的
        // 1 变量的声明
        let a;
        // 2 变量的赋值
        a = 10;

        // 3 声明变量同时来赋值
        let b = "full stop";
        // let 声明的变量不能重复声明
        // let a;
        a = 20
        // 输出变量的值
        console.log(a);
        console.log(b);
        // 常量
        const c = 10;
        // const c = 20  // 报错
        // c = 20;     // 报错
        console.log(a,b,c);
</script>
</body>
</html>

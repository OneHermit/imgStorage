<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        // Number
        let age = 18  // 整数
        let age2 = -18  // 整数
        let price = 12.12   // 小数

        console.log(typeof age,typeof age2,typeof price);
        // + - * / %取模(求余数)
        console.log(age + 1);
        console.log(5 % 2);
        console.log(6 % 2);
        // 字符串
        let name = '小明'
        console.log('姓名:' + name + ' 年龄:' + age);
        // 字符串模板
        console.log(`姓名:${name} 年龄:${age}`);
        // boolean
        let flag = true;
        let flag2 = false;
        console.log(typeof flag);
        // undefined : 没有赋值
        let username;
        console.log(username)

        let aaa = null;
        console.log(aaa);

    </script>
</head>
<body>
    
</body>
</html>

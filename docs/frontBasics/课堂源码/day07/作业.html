<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        /* 处理卡片 */
        .box{
            display: flex;
            gap: 20px;
            /* 主轴居中 */
            justify-content: center;
            /* 让 box 高度等于浏览器高度 
                vh 浏览器宽高比例
            */
            height: 100vh;
            align-items: center;
            
        }

        /* 处理卡片效果 */
        .box-card{
            width: 280px;
            /* 溢出隐藏 */
            overflow: hidden;

            background-color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 12px;

            /* 动画 */
            transition: all 0.4s ease;
        }
        /* 处理图片显示 */
        .box-card .box-img{
            height: 200px;
            /* 图片溢出隐藏 */
            overflow: hidden;
        }
        .box-card img{
            width: 100%;

            transition: all 0.4s ease;
        }
        /* 内容显示 */
        .content{
            padding: 20px;
        }
        .content h3{
            margin-bottom: 10px;
        }
        .content p{
            font-size: 14px;
            color: #666;
        }
        /* 价格显示 */
        .price .new-price{
            font-weight: bold;
            color: rgb(201, 37, 37);
            font-size: 22px;
        }
        .price .old-price{
            font-size: 14px;
            color: #999;
            margin-left: 5px;
            text-decoration: line-through;
        }
        /* 按钮处理 */
        .btns{
            display: flex;
            /* 子项间距 */
            gap: 10px;
            margin: 15px 0;
        }
        .btns div{
            border-radius: 6px;
            padding:10px 0;
            font-weight: bold;
            color: white;
            font-size: 14px;

            /* 综合属性flex */
            flex: 1 0 0;
            text-align: center;

            /* 加动画 */
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .btns div:first-child {
            background-color: green;
        }
        .btns div:last-child {
            background-color: red;
        }

        /* 加入鼠标移入卡片,图片放大 */
        .box-card:hover img{
            transform: scale(1.2);
        }
        .box-card:hover{
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        /* 按钮效果 */
        .btns div:hover{
            transform: translateY(-2px);
            background-color: #666;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="box-card">
            <div class="box-img">
                <img src="./image/运动手表.png" alt="">
            </div>
            <div class="content">
                <h3>智能运动手表</h3>
                <p>全天候健康检测,50米防水,超长续航30天,支持多种运动模式.</p>
                <div class="price">
                    <span class="new-price">￥899</span>
                    <span class="old-price">￥1299</span>
                </div>
                <div class="btns">
                    <div>加入购物车</div>
                    <div>立即购买</div>
                </div>
            </div>
        </div>

        <div class="box-card">
            <div class="box-img">
                <img src="./image/运动手表.png" alt="">
            </div>
            <div class="content">
                <h3>智能运动手表</h3>
                <p>全天候健康检测,50米防水,超长续航30天,支持多种运动模式.</p>
                <div class="price">
                    <span class="new-price">￥899</span>
                    <span class="old-price">￥1299</span>
                </div>
                <div class="btns">
                    <div>加入购物车</div>
                    <div>立即购买</div>
                </div>
            </div>
        </div>

        <div class="box-card">
            <div class="box-img">
                <img src="./image/运动手表.png" alt="">
            </div>
            <div class="content">
                <h3>智能运动手表</h3>
                <p>全天候健康检测,50米防水,超长续航30天,支持多种运动模式.</p>
                <div class="price">
                    <span class="new-price">￥899</span>
                    <span class="old-price">￥1299</span>
                </div>
                <div class="btns">
                    <div>加入购物车</div>
                    <div>立即购买</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 标题:特点,文字变大,加粗,独占一行  -->
    <h1>一号标题</h1>
    <h2>二号标题</h2>
    <h3>三号标题</h3>
    <h4>四号标题</h4>
    <h5>五号标题</h5>
    <h6>六号标题</h6>
    <hr>
    <!-- 段落标签;独占一行,段落和段落之间有个比较大的间隙 -->
    <p>我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落我是一个段落</p>
    <p>我是一个段落</p>
    <hr>
    <!-- 强制换行,没有间隙  -->
    普通文本<br><br>
    普通文本
    <hr>
    <u>世界</u><i>那么</i><b>大</b>,我想去 <s>看看</s>
    <br>
    <s><u><i><b>统一格式</b></i></u></s>
    <hr>
    html 网页的&nbsp;&nbsp;&nbsp;&nbsp;根标签是&lt;html&gt;
    <br>
    <br>
</body>
</html>

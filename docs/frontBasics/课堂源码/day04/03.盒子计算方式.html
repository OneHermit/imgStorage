<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            /* 盒子计算方式设置 
            box-sizing:
            content-box: 默认:盒子的最终宽高 = 内边距 + 边框值 + 内容宽高
            border-box: 盒子的最终宽高 = width、height
            */
            box-sizing: border-box;
            width: 200px;
            height: 200px;
            border: 20px solid red;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="box1">
        box1
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 大布局标签: 存放其他的标签
        独占一行,有换行
    -->
    <div>
        <!-- 特点:独占一行,内部放文本 -->
        <h1>这是一个示例标题</h1>
        <!-- 特点:独占一行,内部放文本 -->
        <p>这个一个段落</p>
        <!-- 没有独占一行,宽度由内容的宽来决定,没有换行 -->
        <span>这个是文本标签</span>
        <span>这个是文本标签2</span>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 列表标签 -->
    <!-- 有序列表 
        ol: order list 
        li: list item    
    -->
    <ol>
        <li>第一点</li>
        <li>第二点</li>
        <li>第三点</li>
    </ol>
    <!-- 无需列表 
    -->
    <h3>中国的四大美女</h3>
    <ul>
        <li>西施</li>
        <li>王昭君</li>
        <li>貂蝉</li>
        <li>杨玉环</li>
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      /* id 选择器: 要求在同一个html文件中值必须唯一
         但是浏览器仁慈会选中ID同值的标签,
         不建议重复
      */
      #abc {
        color: red;
      }
    </style>
</head>
<body>
    <a id="abc" href="#">hello</a>
    <a href="#">hello</a>
    <a href="#">hello</a>
    <h1>
        这是一个标题
        <a href="#">p hello</a>
    </h1>
    <h1 id="abc">标题2</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       /* 类选择器:选中class 属性值相同的所有标签 
        使用多个类选择器,执行顺序是从上往下,相同会被覆盖
       */
       .box2 {
            color: pink;
        }
        
        .box {
            color: red;
            font-size: 50px;
        }
 
    </style>
</head>
<body>
    <!-- 理解为 给 a 标签起一个外号,只有它有,与众不同
        外号不是唯一的,其他人也可以取这个外号
    -->
    <a class="box" href="#">hello</a>
    <a href="#">hello</a>
    <a href="#">hello</a>
    <h1>
        这是一个标题
        <a href="#">p hello</a>
    </h1>
    <h1 class="box2 box">标题2</h1>
</body>
</html>

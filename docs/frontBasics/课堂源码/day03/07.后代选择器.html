<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      /* p {
        color: red;
      } */
      /* 后代选择器 : 选中指定标签的所有后代,包括孙子 */
      /* 选中 box 下的所有 p 标签 */
      /* .box p{
        color: red;
      } */

      /* 选中 box 下 的 box_p 后代类 */
      .box .box_p{
        color: red;
      }
    </style>
</head>
<body>
   <p>外部p1</p>
   <p>外部p2</p>
   <div class="box">
      <p>儿子p1</p>
      <p class="box_p">儿子p2</p>
      <div>
        <p class="box_p">孙子p1</p>
        <p>孙子p2</p>
      </div>
   </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS 注释 */
        /* 选择器: 告诉浏览器要选中整个HTML 文档中的哪个标签 */
        p{
            /* 设置字体颜色 */
            color: red;
            /* 设置字体的大小 */
            font-size: 50px;
            /* 背景颜色设置 */
            background-color: pink;
            /* 宽高设置 */
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <!--  -->
    <h1>hello</h1>
    <p>hello world 您好 世界</p>
</body>
</html>

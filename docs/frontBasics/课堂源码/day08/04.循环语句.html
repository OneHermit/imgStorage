<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 循环: 重复做一件事情,打印100次 hello world
        /* while 循环语句
            while(boolean 表达式){
                boolean 表达式为true 时执行的代码
            }
        */
         // 死循环,条件永远为true
        //  while(false){
        //     console.log('while 死循环');
        //  }
        // 定义一个计数器 (i) 1-100
        let i = 1;
        while(i <= 100){
            console.log(i);
            i = i + 1;
        }
        /* for 语法
            for(初始化计数器; boolean 表达式 ; 计数器+-1){
                循环执行的代码
            }
        */
        // 打印 1 - 100
        for(let i2 = 1; i2 <= 100; i2++){
            console.log(`计数器:${i2}`);
            //i2 = i2 + 1;
        }
    </script>
</head>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box{
            width: 200px;
            height: 300px;
            border: 2px solid red;
            margin: 20px;

            /* 不溢出 */
            overflow: hidden;
            position: relative;
        }
        .box:hover img{
            /* 放大 */
            transform: scale(1.2);
        }
        .box img{
            transition: all 1s ease;
        }
        /* 处理标题 */
        .box .title{
            background-color:rgba(0, 0, 0, 0.5);
            position: absolute;
            width: 100%;
            height: 100px;
            bottom: -100px;
            text-align: center;

            color: white;
        }
        .box .title{
            transition: all 1s ease;
        }

        .box:hover .title{
            /* 放大 */
            transform: translateY(-100px);
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="./image/篮球.png" width="100%" height="100%" alt="">
        <div class="title">
            <h3>篮球</h3>
            <p>正在打篮球</p>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. 编写一个函数 isEvenOrOdd (num)，接收一个整数 num，
        // 判断该数是偶数还是奇数，并返回字符串 "偶数" 或 "奇数"。
        function isEvenOrOdd(num){
            // if(num % 2 == 0){
            //     return "偶数";
            // }else{
            //     return "奇数";
            // }
            return num % 2 == 0 ? "偶数" : "奇数";
        }
        console.log(isEvenOrOdd(66));
        // 2. 编写一个函数 sumEvenNumbers (n)， 
        // 计算从 1 到 n（包含）之间所有偶数的和，使用 for 循环实现。
        function sumEvenNumbers(n){
            // 1 获取到 1 - n 每个数
            // 2 判断拿到的数是否为偶数
            //   是偶数:   把数据保存还要叠加
            //   不是偶数: 不管
            let sum = 0;
            for(let i = 1; i <= n; i++){
                // console.log(i);
                if(i % 2 == 0){
                    sum = sum + i;
                }
            }
            console.log('偶数之和:', sum);
        }
        sumEvenNumbers(1000);

        // 3. 编写一个函数 isSeason (num), 接收一个 1-12 的整数，
        // 判断该月份属于什么季节。（3-5 春季，6-8 夏季， 9-11 秋季，
        // 12-2 冬季）

        function isSeason(num){
            // 1 判断数字是否是1-12,否则,提示没这个月份
            if(num >= 1 && num <= 12){
                
                if(num >= 3 && num <= 5){
                    console.log("春季");
                }else if(num >= 6 && num <= 8){
                    console.log("夏季");
                }else if(num >= 9 && num <= 11){
                    console.log("秋季");
                }else{
                    console.log("冬季");
                }

            }else{
                console.log("没有这个月份");
            }
        }
        isSeason(2)
    </script>
</body>
</html>

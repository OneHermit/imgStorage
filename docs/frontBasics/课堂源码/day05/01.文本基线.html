<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: pink;
            /* 注意,使用行高无法垂直居中 */
            height: 60px;
            line-height: 60px;
        }
        /* 设置文本和图片对齐方式为 中线对齐 */
        img{
            vertical-align: middle;
        }
        span {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div>
        <img src="./image/大白菜.png" alt="">
        <span>您好,hello</span>
    </div>
</body>
</html>

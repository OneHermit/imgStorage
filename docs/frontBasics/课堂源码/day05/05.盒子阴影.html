<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width:200px;
            height: 300px;
            border: 1px solid #ccc;

            /* 设置阴影
                水平移动 垂直移动 阴影程度 阴影的范围 颜色
            */
            /* box-shadow: 0px 0px 5px 5px #ccc ;  */
            /* box-shadow: 0px 0px 5px 5px black inset; */

            border-radius: 10px;
        }

        .box:hover{
            box-shadow: 0px 0px 5px 5px #ccc ; 
        }
        button:hover{
            box-shadow: 0px 0px 5px 5px #ccc ; 
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <br>
    <button>按钮</button>
</body>
</html>

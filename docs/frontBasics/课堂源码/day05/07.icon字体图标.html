<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./font_ocw6l6r3p0k/iconfont.css">
    <style>
        /* 图片放大会模糊,图标不会 */
        /* 文字图标
            1 可以设置颜色
            2 可以调整大小,不会模糊
            3 有时候样式设置会失败,没有权限的问题,需要修改 iconfont.css  注释 font-style: normal;
        */
        .icon-zhuye1{
            color: red;
            font-size: 200px;
        }

        /* 
            svg 的图标
            1. 使用简单快速
            2 放大不会模糊,但是不能修改颜色
        */
    </style>
</head>
<body>
    <img src="./image/大白菜.png" alt="" width="200px">
    <span class="iconfont icon-zhuye1"></span>
    <img src="./image/主页.svg" alt="" width="1000px">
</body>
</html>

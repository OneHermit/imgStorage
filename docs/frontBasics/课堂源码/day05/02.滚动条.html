<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            border: 2px solid pink;
            /* 开启滚动条,让内容收到框框内部,不被溢出 */
            /* overflow: scroll;  水平方向没有溢出,也有滚动条 */
            overflow: auto;   /* 只提供溢出方向的滚动条 */
            /* overflow: hidden; */
        }
        h1{
            width: 400px;
            background-color: greenyellow;
        }

    </style>
</head>
<body>
    <div class="box">
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
        <h1>hello</h1>
    </div>
</body>
</html>
